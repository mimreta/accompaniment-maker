name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not paste your MVSEP key or attach your recordings.
  - type: textarea
    id: what
    attributes: {label: What happened and what did you expect?}
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Browser and device, placeholder: "Chrome 130 on Android"}
  - type: dropdown
    id: build
    attributes:
      label: Which version?
      options: [Web version, Apps Script version]
